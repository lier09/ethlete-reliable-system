name: Statistical acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: validation/python/requirements.txt

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install independent validation dependencies
        run: python -m pip install -r validation/python/requirements.txt

      - name: Install R validation packages
        run: Rscript -e "install.packages(c('irr', 'psych', 'jsonlite'))"

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Cross-language statistical validation
        run: |
          Rscript validation/R/generate_gold_standard.R
          npm run validate:statistics

      - name: Production build
        run: npm run build
